name: Deploy Cloud Functions

on:
  push:
    branches: [ main, backend ]
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: revival-e0aa5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build functions
        run: npm run build --workspace=packages/functions
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'
          
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Deploy Functions to Firebase
        run: |
          # Force Firebase to use the authenticated service account
          gcloud config set account firebase-adminsdk-fbsvc@revival-e0aa5.iam.gserviceaccount.com
          firebase deploy --only functions --project $FIREBASE_PROJECT_ID --force
