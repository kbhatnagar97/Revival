name: Deploy Cloud Functions

on:
  push:
    branches: [ main, backend ]
    paths: [ 'packages/functions/**', 'packages/shared/**' ]
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: revival-e0aa5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build functions
        run: npm run build --workspace=packages/functions
        
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Authenticate with Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          firebase use $FIREBASE_PROJECT_ID
        
      - name: Deploy Functions to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          firebase deploy --only functions --project $FIREBASE_PROJECT_ID --force
        
      - name: Cleanup
        run: rm -f $HOME/firebase-service-account.json
