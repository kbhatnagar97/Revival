name: Deploy Cloud Functions

on:
  push:
    branches: [ main, backend ]
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: revival-e0aa5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build functions
        run: npm run build --workspace=packages/functions
        
      - name: Setup Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Add Service Account Impersonation Permission
        run: |
          # Create service account key file
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/service-account.json
          
          # Activate service account
          gcloud auth activate-service-account --key-file=/tmp/service-account.json
          gcloud config set project $FIREBASE_PROJECT_ID
          
          # Add permission for Firebase Admin SDK to act as App Engine service account
          gcloud projects add-iam-policy-binding $FIREBASE_PROJECT_ID \
            --member="serviceAccount:firebase-adminsdk-fbsvc@revival-e0aa5.iam.gserviceaccount.com" \
            --role="roles/iam.serviceAccountUser"
          
          # Cleanup
          rm -f /tmp/service-account.json
          
      - name: Deploy Functions to Firebase
        run: |
          # Create service account key file
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/service-account.json
          
          # Set GOOGLE_APPLICATION_CREDENTIALS and deploy
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
          
          # Deploy with proper authentication
          firebase deploy --only functions --project $FIREBASE_PROJECT_ID --force
          
          # Cleanup
          rm -f /tmp/service-account.json
